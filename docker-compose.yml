# Self-host PeerPad + automatic HTTPS (Caddy gets a free Let's Encrypt certificate).
# Usage:  echo "DOMAIN=notes.example.com" > .env && docker compose up -d --build
services:
  peerpad:
    build: .
    restart: unless-stopped
    volumes:
      - peerpad-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - peerpad
  # Optional AI access (MCP). Enable with:  docker compose --profile mcp up -d --build
  # Needs PEERPAD_INVITE and MCP_TOKEN in .env. Reachable at https://$DOMAIN/mcp
  mcp:
    build: .
    profiles: ["mcp"]
    restart: unless-stopped
    command: ["node", "mcp/peerpad-mcp.js"]
    environment:
      - TRANSPORT=http
      - HOST=0.0.0.0
      - PORT=3333
      - MCP_ALLOWED_HOSTS=${DOMAIN}
      - PEERPAD_INVITE=${PEERPAD_INVITE:-}
      - MCP_TOKEN=${MCP_TOKEN:-}
      - PEERPAD_AI_NAME=${PEERPAD_AI_NAME:-AI assistant}
    depends_on:
      - caddy
volumes:
  peerpad-data:
  caddy-data:
  caddy-config:
